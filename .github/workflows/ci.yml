name: CI — Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: 🧪 Quality Gate (Typecheck & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: edge/package-lock.json

      - name: Install Edge Dependencies
        working-directory: edge
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: edge
        run: npx tsc --noEmit

      - name: Run Vitest Suite (Unit & Contract Tests)
        working-directory: edge
        run: npm test
